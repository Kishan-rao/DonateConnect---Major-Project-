# Test Configuration - Uses isolated H2 in-memory database
spring.datasource.url=jdbc:h2:mem:donateconnect_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test JWT config (never use this in production)
app.jwt.secret=TestSecretKeyForJunitTestsMustBe32BytesLong12345!
app.jwt.expiration-ms=3600000

# Storage config for tests (temp dir)
app.storage.upload-dir=target/test-uploads/

# Disable data initializer during tests
spring.jpa.defer-datasource-initialization=true
app.seed.enabled=false
