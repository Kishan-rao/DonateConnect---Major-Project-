spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=native

# Data Source Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (defaults to 30 days for persistent mobile/web logins)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Mail Provider (auto prefers brevo HTTP API when BREVO_API_KEY is configured, falls back to smtp)
app.mail.provider=${MAIL_PROVIDER:auto}
app.mail.from=${MAIL_FROM:${BREVO_SENDER_EMAIL:noreply@donateconnect.com}}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# Spring Mail
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:smtp-relay.brevo.com}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${BREVO_SMTP_USER:${SPRING_MAIL_USERNAME:${SMTP_USER:}}}
spring.mail.password=${BREVO_SMTP_KEY:${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Local File Storage
app.storage.upload-dir=${UPLOAD_DIR:uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://localhost,capacitor://localhost,http://localhost}

# Application Name
spring.application.name=DonateConnect Backend

# Seed Data
app.seed.enabled=${APP_SEED_ENABLED:false}

# Logging Configuration
logging.level.com.donateconnect.controller.AuthController=${LOGGING_LEVEL_AUTH_CONTROLLER:INFO}
